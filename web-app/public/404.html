<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect
    var l = window.location;
    var base = '/quadra/';
    var path = l.pathname.replace(base, '');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      base + '?p=' + encodeURIComponent(path) + l.hash
    );
  </script>
</head>
<body></body>
</html>
